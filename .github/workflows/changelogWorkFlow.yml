# Generates release notes from the commits on master and publishes them to both
# CHANGELOG.md and a GitHub Release. Fully automated: no PR, no approval, no
# human in the loop.
#
# Three ways in:
#
#   workflow_call     publishWorkFlow.yml calls this as a dependent job once it
#                     has tagged the release. This is the normal path, and it
#                     has to be a call rather than a tag trigger: the publish
#                     workflow pushes its tag with GITHUB_TOKEN, and GitHub
#                     suppresses workflow triggers for token-created events, so
#                     an `on: push: tags` rule would silently never fire.
#   push (tags)       Covers tags pushed by a human, which do trigger normally.
#   workflow_dispatch Regenerate notes for any existing tag, on demand.

name: Changelog

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to generate notes for (e.g. v2.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to generate notes for (e.g. v2.1.0)'
        required: true
        type: string

jobs:
  changelog:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Full history and all tags: the generator needs to walk master between
      # two tags. Checking out master rather than the tag ref, because the
      # CHANGELOG.md commit has to land on the branch — a tag push leaves you
      # on a detached HEAD otherwise.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" master; then
            echo "::error::Tag $TAG is not on master; nothing to generate."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          bash .github/scripts/generate-release-notes.sh "${{ steps.tag.outputs.tag }}" > /tmp/notes.md
          echo "--- generated notes ---"
          cat /tmp/notes.md

      # Before the CHANGELOG.md commit on purpose: publishing the Release is the
      # part that cannot be recovered by re-running later, and a rejected push
      # must not take it down with it. This step is idempotent.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi

      - name: Update CHANGELOG.md
        id: changelog
        run: |
          bash .github/scripts/update-changelog.sh "${{ steps.tag.outputs.version }}" /tmp/notes.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # [skip ci] keeps this docs-only commit from re-triggering the build
      # workflow, which also runs on pushes to master.
      - name: Commit CHANGELOG.md
        if: steps.changelog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ steps.tag.outputs.tag }} [skip ci]"
          if ! git push origin master; then
            echo "::error::Could not push CHANGELOG.md to master. The GitHub Release was published successfully and is unaffected."
            exit 1
          fi
