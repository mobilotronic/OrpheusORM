  assemblies:
  - OrpheusCore
  namespace: OrpheusCore
  summary: >-
    Initializes a new instance of the <xref href="OrpheusCore.OrpheusDatabase" data-throw-if-not-resolved="false"></xref> class, using a

    connection factory. Connect() leases a pooled connection from the factory instead

    of opening a directly-injected connection; Dispose()/Disconnect() return it to the

    ADO.NET pool. The connection has the same one-per-<xref href="OrpheusCore.OrpheusDatabase" data-throw-if-not-resolved="false"></xref>-instance

    lifetime as the <xref href="System.Data.IDbConnection" data-throw-if-not-resolved="false"></xref> constructor overload — this does not lease

    a new connection per operation.
  example: []
  syntax:
    content: public OrpheusDatabase(IOrpheusConnectionFactory connectionFactory, IOrpheusDDLHelper ddlHelper, ILogger<IOrpheusDatabase> logger, IServiceProvider serviceProvider = null, ILoggerFactory loggerFactory = null)
    parameters:
    - id: connectionFactory
      type: OrpheusInterfaces.Core.IOrpheusConnectionFactory
      description: The connection factory.
    - id: ddlHelper
      type: OrpheusInterfaces.Core.IOrpheusDDLHelper
      description: The DDL helper.
    - id: logger
      type: Microsoft.Extensions.Logging.ILogger{OrpheusInterfaces.Core.IOrpheusDatabase}
      description: The logger
    - id: serviceProvider
      type: System.IServiceProvider
      description: Optional service provider for resolving dependencies.
    - id: loggerFactory
