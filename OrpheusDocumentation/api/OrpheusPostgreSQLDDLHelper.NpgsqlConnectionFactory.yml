    startLine: 89
  assemblies:
  - OrpheusPostgreSQLDDLHelper
  namespace: OrpheusPostgreSQLDDLHelper
  summary: >-
    Creates (but does not open) a new pooled connection to the same target database as

    <xref href="OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateConnection" data-throw-if-not-resolved="false"></xref>, independent of the main database's connection/transaction

    state — e.g. for schema introspection while the main connection may be mid-transaction.

    Unlike CreateConnection(), the connection is left closed: callers that hold onto this

    connection across multiple operations manage its open/close state themselves.

    Callers must dispose the returned connection when done.
  example: []
  syntax:
    content: public IDbConnection CreateSecondaryConnection()
    return:
      type: System.Data.IDbConnection
    content.vb: Public Function CreateSecondaryConnection() As IDbConnection
  overload: OrpheusPostgreSQLDDLHelper.NpgsqlConnectionFactory.CreateSecondaryConnection*
  implements:
  - OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateSecondaryConnection
- uid: OrpheusPostgreSQLDDLHelper.NpgsqlConnectionFactory.CreateAdministrativeConnection
