  nameWithType: NpgsqlConnectionFactory.CreateAdministrativeConnection()
  fullName: OrpheusPostgreSQLDDLHelper.NpgsqlConnectionFactory.CreateAdministrativeConnection()
  type: Method
  source:
    remote:
      path: OrpheusPostgreSQLDDLHelper/NpgsqlConnectionFactory.cs
      branch: feature/modernazitation-effort
      repo: git@github.com:mobilotronic/OrpheusORM.git
    id: CreateAdministrativeConnection
    path: ../OrpheusPostgreSQLDDLHelper/NpgsqlConnectionFactory.cs
    startLine: 95
  assemblies:
  - OrpheusPostgreSQLDDLHelper
  namespace: OrpheusPostgreSQLDDLHelper
  summary: >-
    Creates (but does not open) a new pooled connection to the engine's administrative/system

    database (SQL Server: master, MySQL: sys, PostgreSQL: postgres), using ServiceUserName/

    ServicePassword/UseIntegratedSecurityForServiceConnection when configured, falling back to

    the main credentials otherwise. Used for database-level operations — existence checks,

    CREATE DATABASE — that can't run against the target database itself. Unlike

    CreateConnection(), the connection is left closed: callers that hold onto this connection

    across multiple operations manage its open/close state themselves.

    Callers must dispose the returned connection when done.
  example: []
  syntax:
    content: public IDbConnection CreateAdministrativeConnection()
    return:
      type: System.Data.IDbConnection
    content.vb: Public Function CreateAdministrativeConnection() As IDbConnection
  overload: OrpheusPostgreSQLDDLHelper.NpgsqlConnectionFactory.CreateAdministrativeConnection*
  implements:
  - OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateAdministrativeConnection
