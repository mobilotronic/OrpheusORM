  nameWithType: OrpheusPostgreSQLDDLHelper.ExecuteBatchedInsertWithKeyRetrieval(string, List<string>, string, List<List<object>>, IDbTransaction)
  fullName: OrpheusPostgreSQLDDLHelper.OrpheusPostgreSQLDDLHelper.ExecuteBatchedInsertWithKeyRetrieval(string, System.Collections.Generic.List<string>, string, System.Collections.Generic.List<System.Collections.Generic.List<object>>, System.Data.IDbTransaction)
  type: Method
  source:
    remote:
      path: OrpheusPostgreSQLDDLHelper/OrpheusPostgreSQLDDLHelper.cs
      branch: feature/modernazitation-effort
      repo: git@github.com:mobilotronic/OrpheusORM.git
    id: ExecuteBatchedInsertWithKeyRetrieval
    path: ../OrpheusPostgreSQLDDLHelper/OrpheusPostgreSQLDDLHelper.cs
    startLine: 398
  assemblies:
  - OrpheusPostgreSQLDDLHelper
  namespace: OrpheusPostgreSQLDDLHelper
  summary: >-
    Executes a batched INSERT of <code class="paramref">rows</code> and returns the DB-generated key

    value for each row, in the same order the rows were passed in. There is no ADO.NET-

    portable way to retrieve generated keys from a multi-row insert, so implementations are

    engine-specific (e.g. SQL Server uses MERGE+OUTPUT with a correlation column since plain

    multi-row OUTPUT doesn't preserve input order; PostgreSQL uses INSERT...RETURNING, which

    does preserve order; MySQL has no RETURNING and instead derives the range from

    LAST_INSERT_ID()).
  remarks: >-
    PostgreSQL implementation note: INSERT...RETURNING preserves input VALUES row order for a

    single statement, so generated keys map back to rows positionally — no correlation column

    needed.


    <p>

    NOT VERIFIED against a real PostgreSQL instance: no reachable PostgreSQL server was

    available in the environment this was implemented in (only SQL Server was reachable, and

    that path IS verified — see SQLServerBatchedInsertKeyRetrievalTests). Verify this against a

    real instance before relying on it in production.

    </p>
  example: []
  syntax:
    content: public List<object> ExecuteBatchedInsertWithKeyRetrieval(string tableName, List<string> columns, string keyColumnName, List<List<object>> rows, IDbTransaction transaction)
    parameters:
    - id: tableName
      type: System.String
      description: Fully-qualified table name.
    - id: columns
      type: System.Collections.Generic.List{System.String}
      description: Editable column names, in the order each row's values are provided.
    - id: keyColumnName
      type: System.String
      description: The DB-generated key column to retrieve.
    - id: rows
      type: System.Collections.Generic.List{System.Collections.Generic.List{System.Object}}
      description: Each row's values, in column order, matching <code class="paramref">columns</code>.
    - id: transaction
      type: System.Data.IDbTransaction
      description: Transaction to execute within.
    return:
      type: System.Collections.Generic.List{System.Object}
    content.vb: Public Function ExecuteBatchedInsertWithKeyRetrieval(tableName As String, columns As List(Of String), keyColumnName As String, rows As List(Of List(Of Object)), transaction As IDbTransaction) As List(Of Object)
