  - vb
  name: ExecuteBatchedInsertWithKeyRetrieval(string, List<string>, string, List<List<object>>, IDbTransaction)
  nameWithType: IOrpheusDDLHelper.ExecuteBatchedInsertWithKeyRetrieval(string, List<string>, string, List<List<object>>, IDbTransaction)
  fullName: OrpheusInterfaces.Core.IOrpheusDDLHelper.ExecuteBatchedInsertWithKeyRetrieval(string, System.Collections.Generic.List<string>, string, System.Collections.Generic.List<System.Collections.Generic.List<object>>, System.Data.IDbTransaction)
  type: Method
  source:
    remote:
      path: OrpheusInterfaces/Core/IOrpheusDDLHelper.cs
      branch: feature/modernazitation-effort
      repo: git@github.com:mobilotronic/OrpheusORM.git
    id: ExecuteBatchedInsertWithKeyRetrieval
    path: ../OrpheusInterfaces/Core/IOrpheusDDLHelper.cs
    startLine: 208
  assemblies:
  - OrpheusInterfaces
  namespace: OrpheusInterfaces.Core
  summary: >-
    Executes a batched INSERT of <code class="paramref">rows</code> and returns the DB-generated key

    value for each row, in the same order the rows were passed in. There is no ADO.NET-

    portable way to retrieve generated keys from a multi-row insert, so implementations are

    engine-specific (e.g. SQL Server uses MERGE+OUTPUT with a correlation column since plain

    multi-row OUTPUT doesn't preserve input order; PostgreSQL uses INSERT...RETURNING, which

    does preserve order; MySQL has no RETURNING and instead derives the range from

    LAST_INSERT_ID()).
  example: []
  syntax:
    content: List<object> ExecuteBatchedInsertWithKeyRetrieval(string tableName, List<string> columns, string keyColumnName, List<List<object>> rows, IDbTransaction transaction)
    parameters:
    - id: tableName
      type: System.String
      description: Fully-qualified table name.
    - id: columns
      type: System.Collections.Generic.List{System.String}
      description: Editable column names, in the order each row's values are provided.
    - id: keyColumnName
      type: System.String
      description: The DB-generated key column to retrieve.
    - id: rows
      type: System.Collections.Generic.List{System.Collections.Generic.List{System.Object}}
      description: Each row's values, in column order, matching <code class="paramref">columns</code>.
    - id: transaction
      type: System.Data.IDbTransaction
      description: Transaction to execute within.
    return:
      type: System.Collections.Generic.List{System.Object}
    content.vb: Function ExecuteBatchedInsertWithKeyRetrieval(tableName As String, columns As List(Of String), keyColumnName As String, rows As List(Of List(Of Object)), transaction As IDbTransaction) As List(Of Object)
  overload: OrpheusInterfaces.Core.IOrpheusDDLHelper.ExecuteBatchedInsertWithKeyRetrieval*
