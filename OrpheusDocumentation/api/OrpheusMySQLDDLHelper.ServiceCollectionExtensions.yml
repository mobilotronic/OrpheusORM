  assemblies:
  - OrpheusMySQLDDLHelper
  namespace: OrpheusMySQLDDLHelper
  summary: >-
    Registers Orpheus for MySQL, resolving the named connection out of an

    <xref href="Microsoft.Extensions.Configuration.IConfiguration" data-throw-if-not-resolved="false"></xref> (e.g. an OrpheusConfig.json file bound via

    <xref href="Microsoft.Extensions.Configuration.ConfigurationBuilder" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: public static IServiceCollection AddOrpheusMySql(this IServiceCollection services, IConfiguration configuration, string connectionName, string sectionName = "OrpheusConfiguration")
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to register into.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: The root configuration (e.g. loaded from OrpheusConfig.json).
    - id: connectionName
      type: System.String
      description: The <code>ConfigurationName</code> of the connection to use.
    - id: sectionName
      type: System.String
      description: The section Orpheus's settings live under. Defaults to "OrpheusConfiguration".
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function AddOrpheusMySql(services As IServiceCollection, configuration As IConfiguration, connectionName As String, sectionName As String = "OrpheusConfiguration") As IServiceCollection
