- uid: OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateSecondaryConnection
  commentId: M:OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateSecondaryConnection
  id: CreateSecondaryConnection
  parent: OrpheusInterfaces.Core.IOrpheusConnectionFactory
  langs:
  - csharp
  - vb
  name: CreateSecondaryConnection()
  nameWithType: IOrpheusConnectionFactory.CreateSecondaryConnection()
  fullName: OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateSecondaryConnection()
  type: Method
  source:
    remote:
      path: OrpheusInterfaces/Core/IOrpheusConnectionFactory.cs
      branch: feature/modernazitation-effort
      repo: git@github.com:mobilotronic/OrpheusORM.git
    id: CreateSecondaryConnection
    path: ../OrpheusInterfaces/Core/IOrpheusConnectionFactory.cs
    startLine: 40
  assemblies:
  - OrpheusInterfaces
  namespace: OrpheusInterfaces.Core
  summary: >-
    Creates (but does not open) a new pooled connection to the same target database as

    <xref href="OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateConnection" data-throw-if-not-resolved="false"></xref>, independent of the main database's connection/transaction

    state — e.g. for schema introspection while the main connection may be mid-transaction.

    Unlike CreateConnection(), the connection is left closed: callers that hold onto this

    connection across multiple operations manage its open/close state themselves.

    Callers must dispose the returned connection when done.
  example: []
  syntax:
    content: IDbConnection CreateSecondaryConnection()
    return:
      type: System.Data.IDbConnection
    content.vb: Function CreateSecondaryConnection() As IDbConnection
  overload: OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateSecondaryConnection*
- uid: OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateAdministrativeConnection
  commentId: M:OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateAdministrativeConnection
  id: CreateAdministrativeConnection
  parent: OrpheusInterfaces.Core.IOrpheusConnectionFactory
  langs:
  - csharp
  - vb
  name: CreateAdministrativeConnection()
  nameWithType: IOrpheusConnectionFactory.CreateAdministrativeConnection()
  fullName: OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateAdministrativeConnection()
  type: Method
  source:
    remote:
      path: OrpheusInterfaces/Core/IOrpheusConnectionFactory.cs
      branch: feature/modernazitation-effort
      repo: git@github.com:mobilotronic/OrpheusORM.git
    id: CreateAdministrativeConnection
    path: ../OrpheusInterfaces/Core/IOrpheusConnectionFactory.cs
    startLine: 52
  assemblies:
  - OrpheusInterfaces
  namespace: OrpheusInterfaces.Core
  summary: >-
    Creates (but does not open) a new pooled connection to the engine's administrative/system

    database (SQL Server: master, MySQL: sys, PostgreSQL: postgres), using ServiceUserName/

    ServicePassword/UseIntegratedSecurityForServiceConnection when configured, falling back to

    the main credentials otherwise. Used for database-level operations — existence checks,

    CREATE DATABASE — that can't run against the target database itself. Unlike

    CreateConnection(), the connection is left closed: callers that hold onto this connection

    across multiple operations manage its open/close state themselves.

    Callers must dispose the returned connection when done.
  example: []
  syntax:
    content: IDbConnection CreateAdministrativeConnection()
    return:
      type: System.Data.IDbConnection
    content.vb: Function CreateAdministrativeConnection() As IDbConnection
  overload: OrpheusInterfaces.Core.IOrpheusConnectionFactory.CreateAdministrativeConnection*
