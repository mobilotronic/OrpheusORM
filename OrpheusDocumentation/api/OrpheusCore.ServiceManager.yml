  source:
    remote:
      path: OrpheusCore/ServiceManager.cs
      branch: feature/modernazitation-effort
      repo: git@github.com:mobilotronic/OrpheusORM.git
    id: AddOrpheusServices
    path: ../OrpheusCore/ServiceManager.cs
    startLine: 91
  assemblies:
  - OrpheusCore
  namespace: OrpheusCore
  summary: >-
    Registers the internal services Orpheus needs at runtime: table options, module and

    schema types, a default <xref href="OrpheusInterfaces.Configuration.IDatabaseConnectionConfiguration" data-throw-if-not-resolved="false"></xref>, and (only if

    nothing has registered <xref href="Microsoft.Extensions.Logging.ILoggerFactory" data-throw-if-not-resolved="false"></xref> yet) a console logger fallback.

    Engine-specific connection factories and DDL helpers are <b>not</b> registered here — use

    the per-engine <code>AddOrpheusSqlServer</code>/<code>AddOrpheusMySql</code>/<code>AddOrpheusPostgreSql</code>

    extension methods (which call this internally) instead of calling this directly.
  example: []
  syntax:
    content: public static IServiceCollection AddOrpheusServices(this IServiceCollection services)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to register Orpheus's services into.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The same <code class="paramref">services</code> instance, for chaining.
    content.vb: Public Shared Function AddOrpheusServices(services As IServiceCollection) As IServiceCollection
  overload: OrpheusCore.ServiceManager.AddOrpheusServices*
