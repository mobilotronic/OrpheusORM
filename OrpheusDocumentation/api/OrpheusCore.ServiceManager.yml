- uid: OrpheusCore.ServiceManager.AddOrpheusServices(Microsoft.Extensions.DependencyInjection.IServiceCollection)
  commentId: M:OrpheusCore.ServiceManager.AddOrpheusServices(Microsoft.Extensions.DependencyInjection.IServiceCollection)
  id: AddOrpheusServices(Microsoft.Extensions.DependencyInjection.IServiceCollection)
