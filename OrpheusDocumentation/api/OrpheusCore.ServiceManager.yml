    id: Resolve
    path: ../OrpheusCore/ServiceManager.cs
    startLine: 129
  assemblies:
  - OrpheusCore
  namespace: OrpheusCore
  summary: >-
    Resolves a service by type from <xref href="OrpheusCore.ServiceManager.ServiceProvider" data-throw-if-not-resolved="false"></xref>. When

    <code class="paramref">constructorParameters</code> is supplied, instead of returning the

    DI-resolved instance directly, this looks up the resolved service's concrete type and

    invokes whichever of its constructors' parameter types are assignable from the supplied

    arguments — for constructing an instance with runtime-known arguments that aren't

    themselves resolvable from the container.
  example: []
  syntax:
    content: public static object Resolve(Type serviceType, object[] constructorParameters)
    parameters:
    - id: serviceType
      type: System.Type
      description: The service type to resolve.
    - id: constructorParameters
      type: System.Object[]
      description: >-
        Constructor arguments to invoke a matching constructor with, or null/empty to just return

        the DI-resolved instance.
    return:
      type: System.Object
    content.vb: Public Shared Function Resolve(serviceType As Type, constructorParameters As Object()) As Object
  overload: OrpheusCore.ServiceManager.Resolve*
  nameWithType.vb: ServiceManager.Resolve(Type, Object())
  fullName.vb: OrpheusCore.ServiceManager.Resolve(System.Type, Object())
  name.vb: Resolve(Type, Object())
