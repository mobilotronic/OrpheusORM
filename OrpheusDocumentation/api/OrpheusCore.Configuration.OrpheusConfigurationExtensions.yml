  summary: >-
    Binds the given configuration section to an <xref href="OrpheusCore.Configuration.Models.OrpheusConfiguration" data-throw-if-not-resolved="false"></xref> and

    returns the named database connection from its <xref href="OrpheusCore.Configuration.Models.OrpheusConfiguration.DatabaseConnections" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static IDatabaseConnectionConfiguration GetOrpheusConnection(this IConfiguration configuration, string connectionName, string sectionName = "OrpheusConfiguration")
    parameters:
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: The root configuration (e.g. loaded from OrpheusConfig.json).
    - id: connectionName
      type: System.String
      description: The <xref href="OrpheusInterfaces.Configuration.IDatabaseConnectionConfiguration.ConfigurationName" data-throw-if-not-resolved="false"></xref> to look up.
    - id: sectionName
      type: System.String
      description: The configuration section Orpheus's settings live under. Defaults to "OrpheusConfiguration".
    return:
      type: OrpheusInterfaces.Configuration.IDatabaseConnectionConfiguration
    content.vb: Public Shared Function GetOrpheusConnection(configuration As IConfiguration, connectionName As String, sectionName As String = "OrpheusConfiguration") As IDatabaseConnectionConfiguration
