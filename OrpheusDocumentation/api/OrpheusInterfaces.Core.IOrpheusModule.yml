  assemblies:
  - OrpheusInterfaces
  namespace: OrpheusInterfaces.Core
  summary: >-
    Loads records from the DB to the table.

    You can configure having multiple fields and multiple values per field.

    Multiple field values are bound with a logical OR.

    Multiple fields by default are bound with a logical OR.

    Defining a logical operator, you can change the default behavior.

    This applies only for the MainTable.
  example: []
  syntax:
    content: void Load(Dictionary<string, List<object>> keyValues, LogicalOperator logicalOperator = LogicalOperator.loOR, bool clearExistingData = true)
    parameters:
    - id: keyValues
      type: System.Collections.Generic.Dictionary{System.String,System.Collections.Generic.List{System.Object}}
      description: ''
    - id: logicalOperator
      type: OrpheusInterfaces.Core.LogicalOperator
      description: ''
    - id: clearExistingData
      type: System.Boolean
      description: ''
    content.vb: Sub Load(keyValues As Dictionary(Of String, List(Of Object)), logicalOperator As LogicalOperator = LogicalOperator.loOR, clearExistingData As Boolean = True)
