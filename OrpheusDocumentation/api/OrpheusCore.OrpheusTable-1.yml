  assemblies:
  - OrpheusCore
  namespace: OrpheusCore
  summary: >-
    Executes inserts. Tables without DB-generated keys are batched into <xref href="OrpheusCore.OrpheusTable%601.BatchSize" data-throw-if-not-resolved="false"></xref>-row

    round trips. Tables with a DB-generated key are also batched into <xref href="OrpheusCore.OrpheusTable%601.BatchSize" data-throw-if-not-resolved="false"></xref>-row

    round trips, using the engine-specific key-retrieval strategy on <xref href="OrpheusInterfaces.Core.IOrpheusDDLHelper" data-throw-if-not-resolved="false"></xref>

    (only a single DB-generated key column is supported).
  example: []
